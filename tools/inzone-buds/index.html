<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INZONE Buds Battery Monitor</title>
<style>
:root{
  color-scheme:dark;--bg:#090811;--panel:#12111d;--panel2:#0d0c15;
  --line:#302744;--text:#f7f4ff;--muted:#aaa0bd;--dim:#776b8f;
  --violet:#8b35ff;--purple:#5a16c9;--pink:#c83cff;
  font-family:Inter,Segoe UI,Arial,sans-serif
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  background:
    radial-gradient(ellipse at 50% -10%,rgba(112,37,210,.25),transparent 36rem),
    radial-gradient(ellipse at 100% 70%,rgba(91,18,155,.12),transparent 28rem),
    var(--bg)
}
main{max-width:940px;margin:0 auto;padding:34px 22px 42px}
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;margin:0 0 24px}
.logo-wrap{
  width:min(100%,380px);padding:9px;border-radius:9px;
  background:linear-gradient(110deg,#24118f 0%,#4310a3 48%,#79009e 100%);
  box-shadow:0 14px 42px rgba(99,23,194,.22)
}
.logo{display:block;width:100%;height:auto;border-radius:4px}
.product-name{font-size:.73rem;letter-spacing:.22em;text-transform:uppercase;color:#a99cc1;font-weight:700}
.panel{background:linear-gradient(145deg,rgba(22,19,34,.98),rgba(13,12,21,.98));border:1px solid var(--line);border-radius:15px;padding:20px;margin:14px 0;box-shadow:0 16px 40px rgba(0,0,0,.24)}
.connection{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center}
.connection-state{display:inline-flex;align-items:center;gap:9px;color:#c8bddc;font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.connection-state:before{content:"";width:8px;height:8px;border-radius:50%;background:#8b8297;box-shadow:0 0 10px currentColor}
.connection-state.ok{color:#b99bff}
.connection-state.ok:before{background:#a65cff}
.connection-state.warn{color:#ffd18a}
.connection-state.warn:before{background:#ffb84d}
.actions{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin-top:16px}
button{
  border:1px solid #8f43ee;border-radius:6px;padding:10px 17px;
  background:linear-gradient(110deg,#6721d3,#902de9);color:white;
  font-weight:750;letter-spacing:.025em;cursor:pointer;
  transition:filter .15s,transform .15s
}
button:hover:not(:disabled){filter:brightness(1.13);transform:translateY(-1px)}
button.secondary{background:#21192e;border-color:#524064;color:#e8ddf8}
button:disabled{opacity:.38;cursor:not-allowed;transform:none}
button[hidden]{display:none!important}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.section-title h2{font-size:.85rem;letter-spacing:.17em;text-transform:uppercase;margin:0;color:#e6d8ff;font-weight:850}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{
  position:relative;overflow:hidden;background:linear-gradient(150deg,#171321,#0c0b13);
  border:1px solid #3a2c50;border-radius:11px;padding:17px;min-height:155px
}
.tile:before{content:none!important;display:none!important}
.tile h3{font-size:.75rem;color:#b9abc9;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin:0 0 18px}
.percent{font-size:clamp(2.3rem,5vw,3rem);font-weight:850;letter-spacing:-.06em;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.bar{height:5px;background:#30283c;overflow:hidden;margin-top:16px;border-radius:5px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#7625e2,#ca49ff);transition:width .25s}
.meta{font-size:.72rem;color:#9e8eb4;margin-top:9px;line-height:1.4}
#caseMeta{color:#b8a8ce}
#message{display:none!important;text-align:center}#support,#lastUpdated,#log,#clear,#disconnect{display:none!important}
button:focus-visible{outline:2px solid #dcbaff;outline-offset:3px}
@media(max-width:650px){
  main{padding:24px 14px 32px}.panel{padding:15px}
  .grid{grid-template-columns:1fr}.tile{min-height:135px}
  .connection{align-items:flex-start}
}

      <h3>Right</h3><div class="percent" id="rightValue">—</div>
      <div class="bar"><div class="fill" id="rightBar"></div></div>
      <div class="meta" id="rightMeta"> </div>
    </div>
    <div class="tile">
      <h3>Case</h3><div class="percent" id="caseValue">—</div>
      <div class="bar"><div class="fill" id="caseBar"></div></div>
      <div class="meta" id="caseMeta">Snapshot</div>
    </div>
  </div>
</section>

<!-- Hidden compatibility elements used internally; no diagnostic UI is displayed. -->
<div hidden>
  <span id="support"></span><span id="lastUpdated"></span>
  <pre id="log"></pre><button id="clear"></button>
</div>
</main><script>
(()=>{
const $=id=>document.getElementById(id),supported=!!navigator.hid;
let device=null,txid=1,pending=new Map(),logLines=[],connected=false,connecting=false,userPaused=false;
const hex=n=>Number(n).toString(16).toUpperCase().padStart(2,'0');
function log(s){}
function badge(id,t,c=''){const el=$(id);if(!el)return;el.textContent=t;el.className=(id==='connection'?'connection-state ':'status ')+c}
function pct(v){return v===255?'—':v<=100?`${v}%`:'—'}
function paint(which,v){$(which+'Value').textContent=pct(v);$(which+'Bar').style.width=(v<=100?v:0)+'%';if(which==='case')$(which+'Meta').textContent=v===255?'—':'Snapshot'}
function sum(a,start){let n=0;for(let i=start;i<a.length;i++)n+=a[i];return n&255}
function isInzone(d){return d && d.vendorId===0x054c && d.productId===0x0ec2 && d.collections.some(c=>c.usagePage===0xff04 && c.inputReports.some(r=>r.reportId===2) && c.outputReports.some(r=>r.reportId===2))}
function onInputReport(e){
 if(!device||e.device!==device||e.reportId!==2)return;
 const d=new Uint8Array(e.data.buffer,e.data.byteOffset,e.data.byteLength);if(d.length<2)return;
 const count=d[0];if(count<12||count>d.length-1)return;const p=d.slice(1,1+count);
 if(p[0]!==4||p[1]!==255||p.length<12||p[3]!==0||p[4]!==0x96||p[5]!==0xc3||p[6]!==0x14)return;
 if(sum(p.slice(0,-1),3)!==p[p.length-1]){log('Sony event checksum mismatch; ignored.');return}
 const ev=p[7],type=p[8],id=p[9]|(p[10]<<8),params=p.slice(11,-1);
 if(ev===4&&(type===0x10||type===0x20)&&params.length>=6){
  paint('left',params[1]);paint('right',params[3]);paint('case',params[5]);
  $('caseMeta').textContent=params[5]===255?'—':'Snapshot';
  $('lastUpdated').textContent='Updated '+new Date().toLocaleTimeString();
  log(`Battery event: L ${pct(params[1])}, R ${pct(params[3])}, case ${pct(params[5])}`);
 }
 const w=pending.get(id);if(w&&ev===w.eventId&&type===0x10){clearTimeout(w.timer);pending.delete(id);w.resolve(params)}
}
function nextId(){const n=txid;txid=(txid+1)&65535;if(!txid)txid=1;return n}
async function getEvent(ev){
 if(!device||!device.opened)throw Error('Dongle is not connected.');
 const id=nextId(),p=new Uint8Array([1,0,0xfc,8,0x96,0xc3,0x41,ev,1,id&255,id>>8,0]);p[11]=sum(p,4);
 const frame=new Uint8Array(63);frame[0]=p.length;frame.set(p,1);
 const reply=new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(Error('No battery reply within 2 seconds. Ensure both earbuds are awake and connected.'))},2000);pending.set(id,{resolve,reject,timer,eventId:ev})});
 try{await device.sendReport(2,frame)}catch(e){const w=pending.get(id);if(w){clearTimeout(w.timer);pending.delete(id)}throw e}
 return await reply
}
async function refresh(){
 if(!connected)return;$('refresh').disabled=true;$('message').textContent='Requesting battery information…';
 try{const p=await getEvent(4);if(p.length<6)throw Error(`Battery response too short (${p.length} bytes).`);
  paint('left',p[1]);paint('right',p[3]);paint('case',p[5]);$('caseMeta').textContent=p[5]===255?'—':'Snapshot';
  $('lastUpdated').textContent='Updated '+new Date().toLocaleTimeString();$('message').textContent='Battery reading received successfully.';log(`GET succeeded: L ${pct(p[1])}, R ${pct(p[3])}, case ${pct(p[5])}`);
 }catch(e){$('message').textContent=e.message;badge('connection','Refresh failed','warn');log('Refresh failed: '+e.message)}finally{$('refresh').disabled=!connected}
}
function rejectPending(reason){for(const [id,w] of pending){clearTimeout(w.timer);w.reject(Error(reason));pending.delete(id)}}
async function attachDevice(d,reason='manual'){
 if(!isInzone(d))throw Error('The selected device is not the expected INZONE Buds control interface.');
 if(connected&&device===d)return true;
 if(connecting)return false;
 connecting=true;$('connect').disabled=true;
 try{
  if(device&&device!==d)await detachDevice(false,false);
  device=d;
  if(!d.opened)await d.open();
  d.removeEventListener('inputreport',onInputReport);d.addEventListener('inputreport',onInputReport);
  connected=true;userPaused=false;badge('connection','Connected','ok');
  $('refresh').disabled=false;$('disconnect').disabled=false;$('connect').disabled=false;$('connect').hidden=true;
  $('message').textContent=reason==='restore'?'Previously approved dongle reconnected. Reading battery…':reason==='usb'?'INZONE dongle detected. Reconnected; reading battery…':'Dongle connected. Reading battery…';
  log(`${reason==='restore'?'Restored saved browser permission':reason==='usb'?'Automatically reconnected after USB connection':'Connected'} to ${d.productName||'Sony INZONE'} (${hex(d.vendorId)}:${hex(d.productId)}).`);
  await refresh();return true;
 }catch(e){
  connected=false;if(device===d){try{d.removeEventListener('inputreport',onInputReport);if(d.opened)await d.close()}catch{}device=null}
  badge('connection','Reconnect needed','warn');$('refresh').disabled=true;$('disconnect').disabled=true;$('connect').disabled=false;
  $('message').textContent=`Could not open the previously approved dongle: ${e.message}. Check that it is plugged in and available.`;log(`Connection attempt failed: ${e.name||'Error'} — ${e.message}`);return false;
 }finally{connecting=false;$('connect').disabled=false}
}
async function detachDevice(manual=true,physical=false){
 const old=device;if(manual)userPaused=true;connected=false;rejectPending(physical?'Dongle disconnected.':'Device connection closed.');
 if(old){old.removeEventListener('inputreport',onInputReport);if(!physical&&old.opened){try{await old.close()}catch{}}}
 device=null;badge('connection','Not connected');$('refresh').disabled=true;$('disconnect').disabled=true;$('connect').disabled=false;$('connect').hidden=false;
 if(physical){$('message').textContent='INZONE dongle disconnected. Waiting for it to be plugged in again…';log('INZONE dongle disconnected; automatic reconnection is enabled.');}
 else if(manual){$('message').textContent='Disconnected for this page. Plug the dongle out and back in, or reload the page to reconnect automatically.';log('Connection closed manually. Browser permission is retained.');}
}
async function restoreApprovedDevice(){
 if(!supported||connected||connecting||userPaused)return;
 try{
  const devices=await navigator.hid.getDevices();
  const d=devices.find(isInzone);
  if(d){$('message').textContent='Found a previously approved Sony dongle. Reconnecting…';await attachDevice(d,'restore');}
  else{$('message').textContent='No previously approved INZONE dongle is currently available. Click Connect once to grant permission; future reconnects can be automatic.';badge('connection','Waiting for dongle','warn');}
 }catch(e){$('message').textContent=`Could not restore the saved device permission: ${e.message}`;log(`Permission restore failed: ${e.message}`)}
}
if(supported){
 badge('support','WebHID supported','ok');
 // Install event handlers before checking prior grants so a device plugged in during startup is not missed.
 navigator.hid.addEventListener('connect',e=>{
  if(!isInzone(e.device))return;
  userPaused=false;
  log('Previously approved INZONE dongle detected on USB. Attempting automatic reconnection…');
  attachDevice(e.device,'usb');
 });
 navigator.hid.addEventListener('disconnect',e=>{
  if(device===e.device)detachDevice(false,true);
 });
 restoreApprovedDevice();
}else{
 badge('support','WebHID unavailable','bad');$('connect').disabled=true;$('message').textContent='Open this file in Chrome or Edge on Windows. WebHID is unavailable in this browser.';
}
$('connect').addEventListener('click',async()=>{
 $('connect').disabled=true;
 try{const found=await navigator.hid.requestDevice({filters:[{vendorId:0x054c,productId:0x0ec2,usagePage:0xff04}]});
  if(!found.length){$('message').textContent='No device selected.';$('connect').disabled=false;return}
  userPaused=false;await attachDevice(found[0],'manual');
 }catch(e){$('message').textContent=`Connection failed: ${e.name||'Error'} — ${e.message}`;badge('connection','Connection failed','warn');log(`Connection failed: ${e.name||'Error'} — ${e.message}`);$('connect').disabled=false;$('connect').hidden=false}
});
$('refresh').addEventListener('click',refresh);$('disconnect').addEventListener('click',()=>detachDevice(true,false));$('clear').addEventListener('click',()=>{logLines=[];$('log').textContent='Log cleared.'});
// Re-check after the browser tab becomes active, including after a PC wake/resume.
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!connected&&!userPaused)restoreApprovedDevice()});
window.addEventListener('focus',()=>{if(!connected&&!userPaused)restoreApprovedDevice()});
})();
</script></body></html>
